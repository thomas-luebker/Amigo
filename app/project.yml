# XcodeGen spec — regenerate with: xcodegen -s app/project.yml
# Generates a classic .xcodeproj (SPM iOSApplication packages cannot be
# signed for real devices — lesson from AmigaImagerPad).
name: iPadUAE
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: de.amiga-imager
settings:
  base:
    DEVELOPMENT_TEAM: Y38P2BJ4DM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # The pre-build step shells out to cmake; Xcode 26 sandboxes user
    # scripts by default and would block it.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iPadUAE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.amiga-imager.uae
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        # App Store name is "Amigo — Amiga Emulator"; this is what shows
        # under the icon (Apple rejected the prior default of PRODUCT_NAME
        # "iPadUAE" under guideline 5.2.5, trademark use of "iPad").
        INFOPLIST_KEY_CFBundleDisplayName: "Amigo"
        # Xcode 26.6: INFOPLIST_KEY_UIFileSharingEnabled does not exist and is
        # silently ignored — UIFileSharingEnabled must live in this partial
        # plist or the app's documents vanish from the Files app.
        INFOPLIST_FILE: iPadUAE-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 20260729
        MARKETING_VERSION: "0.6.4"
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: "-lz -luaecore"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/../build/ios"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../build/ios-sim"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/../vendor/WinUAE $(PROJECT_DIR)/../vendor/WinUAE/od-unix $(PROJECT_DIR)/../vendor/WinUAE/od-unix/include $(PROJECT_DIR)/../vendor/WinUAE/include"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/iPadUAE-Bridging-Header.h"
    dependencies:
      - framework: ../vendor/SDL3/SDL3.xcframework
        embed: true
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
    # A pre-build step so the C core is always up to date when you Archive
    # from the Xcode GUI (Product → Archive) without running scripts first.
    preBuildScripts:
      - name: Build WinUAE core (libuaecore.a)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            "${PROJECT_DIR}/../scripts/build-ios-core.sh" simulator
          else
            "${PROJECT_DIR}/../scripts/build-ios-core.sh" device
          fi
# Shared scheme so Product → Archive works from the Xcode GUI.
schemes:
  iPadUAE:
    build:
      targets:
        iPadUAE: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
